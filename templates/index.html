<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ bot_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --aqua: #22c5d8;
      --aqua-dark: #0e8fa3;
      --aqua-soft: #e6f9fc;
      --mint: #b8f0e0;
      --white: #ffffff;
      --ink: #123943;
      --muted: #6a8c95;
      --line: #d3edf2;
      --lemon: #ffe873;
      --red: #e2504f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--ink);
      background: linear-gradient(160deg, #d6f6fb 0%, #bdeee6 100%);
      position: relative;
      overflow: hidden;
    }

    .bubble-bg {
      position: fixed;
      bottom: -80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.8);
      animation: float linear infinite;
      pointer-events: none;
    }

    .bubble-bg:nth-child(1) { left: 8%; width: 40px; height: 40px; animation-duration: 12s; }
    .bubble-bg:nth-child(2) { left: 25%; width: 70px; height: 70px; animation-duration: 17s; animation-delay: 3s; }
    .bubble-bg:nth-child(3) { left: 48%; width: 30px; height: 30px; animation-duration: 10s; animation-delay: 1s; }
    .bubble-bg:nth-child(4) { left: 68%; width: 60px; height: 60px; animation-duration: 15s; animation-delay: 5s; }
    .bubble-bg:nth-child(5) { left: 88%; width: 45px; height: 45px; animation-duration: 13s; animation-delay: 2s; }

    .app {
      position: relative;
      width: 100%;
      max-width: 820px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: var(--white);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(14, 143, 163, 0.25);
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 26px;
      background: linear-gradient(135deg, var(--aqua), var(--aqua-dark));
      color: var(--white);
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--white);
      display: grid;
      place-items: center;
      font-size: 26px;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.35);
    }

    header h1 {
      font-family: "Quicksand", sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    header p { font-size: 12.5px; opacity: 0.9; }

    .clear-btn {
      margin-left: auto;
      background: rgba(255, 255, 255, 0.2);
      color: var(--white);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      padding: 8px 16px;
      font-family: "Quicksand", sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .clear-btn:hover { background: var(--white); color: var(--aqua-dark); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--aqua-soft);
    }

    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

    .message {
      max-width: 82%;
      padding: 12px 17px;
      line-height: 1.65;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: pop 0.25s ease;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--white);
      border: 1.5px solid var(--line);
      border-radius: 20px 20px 20px 4px;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--aqua), var(--aqua-dark));
      color: var(--white);
      border-radius: 20px 20px 4px 20px;
    }

    .message.error {
      background: #fdeaea;
      border-color: var(--red);
      color: var(--red);
    }

    .typing {
      display: flex;
      gap: 6px;
      padding: 16px 20px;
    }

    .typing span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--aqua);
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    .input-area {
      display: flex;
      gap: 12px;
      padding: 16px 24px 20px;
      background: var(--white);
      border-top: 1.5px solid var(--line);
    }

    #input {
      flex: 1;
      resize: none;
      max-height: 120px;
      padding: 13px 20px;
      background: var(--aqua-soft);
      color: var(--ink);
      border: 2px solid transparent;
      border-radius: 22px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    #input::placeholder { color: var(--muted); }
    #input:focus { border-color: var(--aqua); background: var(--white); }

    #send {
      width: 52px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--lemon), #ffd23f);
      color: var(--ink);
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #send:hover { transform: scale(1.1) rotate(-8deg); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-7px); }
    }

    @keyframes float {
      from { transform: translateY(0); opacity: 0.9; }
      to { transform: translateY(-115vh); opacity: 0; }
    }

    @media (max-width: 600px) {
      body { padding: 0; }
      .app { height: 100vh; border-radius: 0; }
      .message { max-width: 92%; }
      header p { display: none; }
    }
  </style>
</head>
<body>
  <div class="bubble-bg"></div>
  <div class="bubble-bg"></div>
  <div class="bubble-bg"></div>
  <div class="bubble-bg"></div>
  <div class="bubble-bg"></div>

  <div class="app">
    <header>
      <div class="logo">🧼</div>
      <div>
        <h1>{{ bot_name }}</h1>
        <p>Fresh answers for your studies</p>
      </div>
      <button class="clear-btn" id="clear">Fresh Start</button>
    </header>

    <div id="messages"></div>

    <div class="input-area">
      <textarea id="input" rows="1" placeholder="Ask a cleaning study question..."></textarea>
      <button id="send" aria-label="Send">✨</button>
    </div>
  </div>

  <script>
    const welcome = {{ welcome | tojson }};
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clear");

    let history = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "message bot typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      inputEl.value = "";
      inputEl.style.height = "auto";
      sendBtn.disabled = true;

      const typing = showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history })
        });
        const data = await response.json();
        typing.remove();

        if (data.reply) {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text });
          history.push({ role: "model", text: data.reply });
        } else {
          addMessage(data.error || "Something went wrong.", "bot error");
        }
      } catch (error) {
        typing.remove();
        addMessage("Network error. Please try again.", "bot error");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    function resetChat() {
      history = [];
      messagesEl.innerHTML = "";
      addMessage(welcome, "bot");
    }

    sendBtn.addEventListener("click", sendMessage);
    clearBtn.addEventListener("click", resetChat);

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = inputEl.scrollHeight + "px";
    });

    resetChat();
  </script>
</body>
</html>
